<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMarket</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Navbar -->
    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold italic tracking-wide">SkillMarket</h1>
        <div class="flex items-center gap-3">
            <div id="userProfileDisplay" class="hidden flex items-center gap-2">
                <img id="navProfileImg" src="" alt="Profile" class="w-9 h-9 rounded-full object-cover border-2 border-white">
                <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg transition cursor-pointer">Logout</button>
            </div>
            <button id="joinBtn" class="bg-violet-600 hover:bg-violet-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition cursor-pointer">Join</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto p-4 max-w-xl flex-1">
        
        <!-- Search Section -->
        <div class="flex gap-2 mb-6 mt-6">
            <input type="text" id="searchInput" placeholder="Search services..." class="flex-1 border border-gray-300 p-3 rounded-xl focus:outline-none focus:border-violet-600 bg-white">
            <button id="searchBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-medium transition cursor-pointer">Search</button>
        </div>

        <!-- Popular Services -->
        <div id="mainContent">
            <h2 class="text-2xl font-serif text-center mb-6 italic text-gray-800">Popular Services</h2>

            <div id="servicesList" class="grid gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
                    <h3 class="text-lg font-serif italic font-bold text-gray-800">Graphic Design</h3>
                    <p class="text-gray-600 text-sm mt-1">Logos, banners and thumbnails.</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
                    <h3 class="text-lg font-serif italic font-bold text-gray-800">Video Editing</h3>
                    <p class="text-gray-600 text-sm mt-1">Professional editing services.</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
                    <h3 class="text-lg font-serif italic font-bold text-gray-800">Web Development</h3>
                    <p class="text-gray-600 text-sm mt-1">Modern website creation.</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
                    <h3 class="text-lg font-serif italic font-bold text-gray-800">Digital Marketing</h3>
                    <p class="text-gray-600 text-sm mt-1">Grow your business online.</p>
                </div>
            </div>
        </div>

        <!-- Auth Modal -->
        <div id="authModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 relative">
                <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold cursor-pointer">&times;</button>
                <h2 class="text-xl font-serif italic font-bold mb-4 text-gray-800 text-center">SkillMarket Account</h2>

                <!-- Tabs -->
                <div class="flex rounded-xl bg-gray-100 p-1 mb-4">
                    <button id="loginTabBtn" class="flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-600 cursor-pointer">Login</button>
                    <button id="signupTabBtn" class="flex-1 py-2 rounded-lg font-medium text-sm transition bg-white shadow-sm text-gray-800 cursor-pointer">Sign Up</button>
                </div>

                <!-- Form -->
                <div class="flex flex-col gap-3">
                    <!-- Profile Picture Upload (Only for Signup) -->
                    <div id="profileUploadContainer" class="flex flex-col items-center">
                        <label class="w-full text-xs text-gray-500 mb-1 font-medium">Upload Profile Picture</label>
                        <div class="flex items-center gap-3 w-full">
                            <input type="file" id="profilePicInput" accept="image/*" class="w-full text-xs text-gray-500 border border-gray-300 rounded-lg p-2 bg-white">
                        </div>
                    </div>

                    <input type="email" id="userEmail" placeholder="Email" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:outline-none focus:border-violet-600">
                    <input type="password" id="userPassword" placeholder="Password" class="w-full border border-gray-300 p-3 rounded-xl text-sm focus:outline-none focus:border-violet-600">
                    
                    <button id="authActionBtn" class="w-full bg-violet-600 hover:bg-violet-700 text-white p-3 rounded-xl font-medium transition cursor-pointer mt-2">Submit</button>
                    <p id="errorMsg" class="text-red-500 text-xs mt-3 text-center"></p>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white text-center py-4 text-sm tracking-wide">
        &copy; 2026 SkillMarket - All Rights Reserved
    </footer>

</body>
</html>
