<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillMarket Login</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .box{
      background:#fff;
      padding:20px;
      border-radius:10px;
      width:320px;
      box-shadow:0 0 10px rgba(0,0,0,.1);
    }
    input,button{
      width:100%;
      padding:10px;
      margin:8px 0;
    }
    button{
      background:#22c55e;
      color:#fff;
      border:none;
      cursor:pointer;
    }
    #userBox{
      display:none;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="box" id="authBox">
  <h2>SkillMarket</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>

  <p id="msg"></p>
</div>

<div class="box" id="userBox">
  <h3>Welcome</h3>
  <p id="userEmail"></p>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiZZL6Mk-KRBCEWN-P4N_ylH-iE9AbuuM",
  authDomain: "skillmarketnew.firebaseapp.com",
  projectId: "skillmarketnew",
  storageBucket: "skillmarketnew.firebasestorage.app",
  messagingSenderId: "215310657131",
  appId: "1:215310657131:web:8c491a920a0a5fc8d0732e",
  measurementId: "G-3WWJ3Z7BNQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signup = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    await createUserWithEmailAndPassword(auth,email,password);
    document.getElementById("msg").innerText="Signup Successful";
  }catch(err){
    document.getElementById("msg").innerText=err.message;
  }
};

window.login = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(err){
    document.getElementById("msg").innerText=err.message;
  }
};

window.logout = async () => {
  await signOut(auth);
};

onAuthStateChanged(auth,(user)=>{
  if(user){
    document.getElementById("authBox").style.display="none";
    document.getElementById("userBox").style.display="block";
    document.getElementById("userEmail").innerText=user.email;
  }else{
    document.getElementById("authBox").style.display="block";
    document.getElementById("userBox").style.display="none";
  }
});
</script>

</body>
</html>
