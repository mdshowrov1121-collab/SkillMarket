<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMarket</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <div>
        <!-- Navbar -->
        <nav class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">SkillMarket</h1>
            <div id="auth-status" class="flex gap-2">
                <button onclick="showLogin()" class="bg-blue-500 text-white px-4 py-2 rounded text-sm">Login</button>
            </div>
        </nav>

        <div class="container mx-auto p-4 max-w-2xl">
            <!-- Search Section -->
            <div class="flex gap-2 mb-8 mt-4">
                <input type="text" id="searchInput" placeholder="Search services..." class="flex-1 border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" onkeyup="handleSearch()">
                <button onclick="handleSearch()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-lg font-medium">Search</button>
            </div>

            <div id="authOrContent">
                <!-- Popular Services Section -->
                <div id="mainContent">
                    <h2 class="text-2xl font-serif text-center mb-6 italic">Popular Services</h2>
                    
                    <div id="servicesList" class="grid gap-4">
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center">
                            <h3 class="text-lg font-serif italic font-bold">Graphic Design</h3>
                            <p class="text-gray-600 text-sm italic mt-1">Logos, banners and thumbnails.</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center">
                            <h3 class="text-lg font-serif italic font-bold">Video Editing</h3>
                            <p class="text-gray-600 text-sm italic mt-1">Professional editing services.</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center">
                            <h3 class="text-lg font-serif italic font-bold">Web Development</h3>
                            <p class="text-gray-600 text-sm italic mt-1">Modern website creation.</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center">
                            <h3 class="text-lg font-serif italic font-bold">Digital Marketing</h3>
                            <p class="text-gray-600 text-sm italic mt-1">Grow your business online.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white text-center py-4 text-sm tracking-wide">
        © 2026 SkillMarket - All Rights Reserved
    </footer>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase/app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase/auth.js";

        // New Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCizL6Mk-KRBCEWN-P4N_yLH-lE9AbuUM",
          authDomain: "skillmarketnew.firebaseapp.com",
          projectId: "skillmarketnew",
          storageBucket: "skillmarketnew.appspot.com",
          messagingSenderId: "215310657131",
          appId: "1:215310657131:web:8c491a920a0a5fc8d0732e",
          measurementId: "G-3WWJ3Z7BNQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const services = [
            { title: "Graphic Design", desc: "Logos, banners and thumbnails." },
            { title: "Video Editing", desc: "Professional editing services." },
            { title: "Web Development", desc: "Modern website creation." },
            { title: "Digital Marketing", desc: "Grow your business online." }
        ];

        window.handleSearch = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listContainer = document.getElementById('servicesList');
            
            const filtered = services.filter(s => s.title.toLowerCase().includes(query) || s.desc.toLowerCase().includes(query));

            listContainer.innerHTML = '';
            if (filtered.length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-500 py-4">No services found.</p>';
                return;
            }

            filtered.forEach(service => {
                const div = document.createElement('div');
                div.className = 'bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center';
                div.innerHTML = `
                    <h3 class="text-lg font-serif italic font-bold">${service.title}</h3>
                    <p class="text-gray-600 text-sm italic mt-1">${service.desc}</p>
                `;
                listContainer.appendChild(div);
            });
        };

        onAuthStateChanged(auth, (user) => {
            const authStatus = document.getElementById('auth-status');
            if (user) {
                authStatus.innerHTML = `<span class="text-gray-700 font-medium text-sm self-center">Hello, ${user.email}</span> <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1.5 rounded text-sm">Logout</button>`;
            } else {
                authStatus.innerHTML = `<button onclick="showLogin()" class="bg-blue-500 text-white px-4 py-2 rounded text-sm">Login</button>`;
            }
        });

        window.handleLogout = function() {
            signOut(auth).then(() => {
                alert("Logged out successfully!");
            });
        };

        window.showLogin = function() {
            document.getElementById('authOrContent').innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">Login to SkillMarket</h2>
                    <input type="email" id="loginEmail" placeholder="Email" class="w-full border p-2.5 mb-3 rounded-lg"><br>
                    <input type="password" id="loginPassword" placeholder="Password" class="w-full border p-2.5 mb-3 rounded-lg"><br>
                    <button onclick="loginUser()" class="bg-blue-500 text-white px-4 py-2.5 rounded-lg w-full mb-3">Login</button>
                    <button onclick="resetToHome()" class="text-gray-600 text-sm underline w-full text-center block mb-2">Back to Home</button>
                    <button onclick="showRegister()" class="text-blue-500 text-sm underline w-full text-center block">Don't have an account? Register</button>
                </div>
            `;
        };

        window.showRegister = function() {
            document.getElementById('authOrContent').innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-sm border">
                    <h2 class="text-xl font-bold mb-4">Register for SkillMarket</h2>
                    <input type="email" id="regEmail" placeholder="Email" class="w-full border p-2.5 mb-3 rounded-lg"><br>
                    <input type="password" id="regPassword" placeholder="Password" class="w-full border p-2.5 mb-3 rounded-lg"><br>
                    <button onclick="registerUser()" class="bg-emerald-500 text-white px-4 py-2.5 rounded-lg w-full mb-3">Register</button>
                    <button onclick="resetToHome()" class="text-gray-600 text-sm underline w-full text-center block mb-2">Back to Home</button>
                    <button onclick="showLogin()" class="text-blue-500 text-sm underline w-full text-center block">Already have an account? Login</button>
                </div>
            `;
        };

        window.resetToHome = function() {
            location.reload();
        };

        window.loginUser = function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("Login successful!");
                    resetToHome();
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };

        window.registerUser = function() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("Registration successful!");
                    resetToHome();
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };
    </script>
</body>
</html>
